name: WOA (Windows on ARM64) Native Build

on:
  push:
    branches: [ woa-build ]
  workflow_dispatch:

jobs:
  build-woa-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (aarch64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WDK is available
        shell: pwsh
        run: |
          $km = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '^10\.0\.' -and (Test-Path (Join-Path $_.FullName 'km')) } |
                Select-Object -First 1
          if ($km) {
            Write-Host "WDK detected: $($km.FullName)"
          } else {
            Write-Host "WDK not detected - installing via winget (this can take a few minutes)..."
            winget install --id Microsoft.WindowsWDK.10.0.26100 --source winget --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
            Write-Host "winget exit code: $LASTEXITCODE"
          }

      - name: Build rustybits (zeroidc) static lib for ARM64
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vsPath) { $vsPath = & $vswhere -latest -products * -property installationPath }
          Write-Host "Visual Studio: $vsPath"
          if (-not $vsPath) { Write-Error "Visual Studio not found"; exit 1 }
          $devCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$devCmd`" -arch=arm64 >nul 2>&1 && cd /d `"$env:GITHUB_WORKSPACE\rustybits`" && cargo build --release --target=aarch64-pc-windows-msvc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build ZeroTier One (Release | ARM64)
        shell: pwsh
        run: |
          msbuild windows\ZeroTierOne.sln /m /p:Configuration=Release /p:Platform=ARM64 /t:ZeroTierOne /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build TapDriver6 (Win8 Release | ARM64)
        shell: pwsh
        continue-on-error: true
        run: |
          msbuild windows\TapDriver6\TapDriver6.vcxproj /m /p:Configuration="Win8 Release" /p:Platform=ARM64 /t:Build /v:minimal
          Write-Host "TapDriver6 exit code: $LASTEXITCODE"

      - name: Fetch ready-made Microsoft-signed ARM64 tap driver
        shell: pwsh
        run: |
          curl.exe -sSL -o "$env:RUNNER_TEMP\zttap300_signed.zip" "https://github.com/zerotier/ZeroTierOne/files/11115819/zttap300.zip"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\zttap300_signed" | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\zttap300_signed.zip" -DestinationPath "$env:RUNNER_TEMP\zttap300_signed" -Force
          Get-ChildItem "$env:RUNNER_TEMP\zttap300_signed" -Recurse | Select-Object FullName

      - name: Package WOA artifacts
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $core = Join-Path $dist 'core'
          $selfBuilt = Join-Path $dist 'tap-windows\arm64-selfbuilt'
          $signed    = Join-Path $dist 'tap-windows\arm64-microsoft-signed'
          New-Item -ItemType Directory -Force -Path $core, $selfBuilt, $signed | Out-Null

          # Core binaries (ARM64)
          $coreSrc = 'windows\Build\ARM64\Release'
          if (Test-Path $coreSrc) {
            Copy-Item (Join-Path $coreSrc '*') -Destination $core -Recurse -Force
          } else {
            Write-Host "WARNING: $coreSrc not found - searching for zerotier-one_arm64.exe"
            Get-ChildItem 'windows' -Recurse -Filter 'zerotier-one_arm64.exe' | ForEach-Object { Copy-Item $_.FullName $core -Force }
          }
          Write-Host "Core files:"; Get-ChildItem $core | Select-Object Name, Length

          # Self-built ARM64 driver
          Get-ChildItem 'windows\TapDriver6' -Recurse -Include *.sys,*.inf,*.cat -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'ARM64' } | ForEach-Object { Copy-Item $_.FullName $selfBuilt -Force }
          Write-Host "Self-built driver files:"; Get-ChildItem $selfBuilt | Select-Object Name, Length

          # Ready-made Microsoft-signed ARM64 driver
          Copy-Item (Join-Path "$env:RUNNER_TEMP\zttap300_signed" '*') -Destination $signed -Recurse -Force
          Write-Host "Signed driver files:"; Get-ChildItem $signed -Recurse | Select-Object FullName

          $readme = @'
ZeroTier One - Native Windows on ARM64 (WOA) build
==================================================

Contents
  core/                         Native ARM64 ZeroTier binaries
    zerotier-one_arm64.exe      The core service binary (install with -I)
    zerotier-cli.exe            Command line client
    zerotier-idtool.exe         Identity tool
  tap-windows/arm64-microsoft-signed/
                                Microsoft-signed ARM64 TAP driver (zttap300.sys/.inf/.cat)
                                Ready to install, no test mode needed
  tap-windows/arm64-selfbuilt/  Driver built from current source (NOT signed)

Installation (run an elevated PowerShell / cmd as Administrator)

1) Install the service:
     copy core\* "C:\ProgramData\ZeroTier\One\"
     cd "C:\ProgramData\ZeroTier\One"
     zerotier-one_arm64.exe -I
   (This installs the ZeroTier service but does not start it yet)

2) Install the TAP driver (pick ONE option):

   Option A (recommended - Microsoft-signed, no test mode):
     Copy the files from tap-windows\arm64-microsoft-signed to
     "C:\ProgramData\ZeroTier\One\tap-windows\arm64\", then right-click
     zttap300.inf -> Install.  (or use: pnputil /add-driver zttap300.inf /install)

   Option B (self-built driver - requires test signing mode):
     bcdedit /set testsigning on   (reboot)
     Copy tap-windows\arm64-selfbuilt\* to "C:\ProgramData\ZeroTier\One\tap-windows\arm64\"
     Right-click zttap300.inf -> Install, or pnputil /add-driver zttap300.inf /install

3) Start the service and join a network:
     net start ZeroTierOne
     zerotier-cli join <network-id>
     zerotier-cli listnetworks

Build info: native aarch64-pc-windows-msvc, built on GitHub Actions windows-11-arm runner.
'@
          Set-Content -Path (Join-Path $dist 'README-INSTALL.txt') -Value $readme -Encoding UTF8

      - name: Upload WOA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-one-woa-arm64
          path: dist/
          retention-days: 14
